server:
  port: ${SERVER_PORT:8080}

finances:
  jwt:
    expiration: 1800000
    secret: ${JWT_SECRET}
spring:
  sql:
    init:
      mode: ALWAYS
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD:finances-api}
    url: jdbc:postgresql://${POSTGRES_URL:localhost:5432/finances-api}
    username: ${POSTGRES_USERNAME:finances-api}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${AI_MODEL:qwen/qwen3-32b}

  data:
    redis:
      host: ${REDIS_URL:localhost}

  output:
    ansi:
      enabled: ALWAYS

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      encryption_key: ${ENCRYPTION_KEY}
    placeholder-replacement: true
    baseline-on-migrate: true

logging:
  level:
    org:
      springframework: INFO